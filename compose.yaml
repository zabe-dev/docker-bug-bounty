services:
  docker-bug-bounty:
    build:
      context: .
      args:
        GO_VERSION: "1.24.7"
    image: docker-bug-bounty:latest
    stdin_open: true
    tty: true
    volumes:
      - ${BUG_BOUNTY_OUTPUT_DIR:-$PWD/output}:/mnt/output
      - wordlists:/opt/wordlists

volumes:
  wordlists:
    name: docker-bug-bounty-wordlists
